name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Validate scripts and configuration
        run: |
          zsh -n Scripts/install.sh Scripts/install-launch-agent.sh Scripts/build-app.sh Scripts/check-rust.sh
          sh -n server/mcops-panel-dispatch
          python3 -m py_compile server/mcops-panel-status.py
          python3 -m json.tool config.example.json >/dev/null
          plutil -lint Resources/Info.plist

  rust-check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Check workspace
        run: cargo check --workspace --all-targets

  rust-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.99.1
      - name: Run Rust checks and real plugin smoke test
        run: ./Scripts/check-rust.sh
