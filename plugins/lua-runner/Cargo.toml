[package]
name = "info-panel-lua-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = { version = "1.4.1", default-features = false }
piccolo = { path = "../../vendor/piccolo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"

[workspace]
resolver = "3"
