[package]
edition = "2021"
name = "piccolo"
version = "0.3.3"
authors = ["kyren <catherine@kyju.org>"]
description = "Stackless Lua VM implemented in pure Rust"
readme = "README.md"
license = "MIT OR CC0-1.0"
repository = "https://github.com/kyren/piccolo"

[dependencies.ahash]
version = "0.8"
default-features = false
features = [
    "std",
    "no-rng",
]

[dependencies.allocator-api2]
version = "0.2"

[dependencies.anyhow]
version = "1.0"

[dependencies.gc-arena]
version = "0.5.3"
features = [
    "allocator-api2",
    "hashbrown",
]

[dependencies.hashbrown]
version = "0.14"
features = ["raw"]

[dependencies.rand]
version = "0.8"
default-features = false
features = ["small_rng"]

[dependencies.thiserror]
version = "1.0"

[dev-dependencies.clap]
version = "4.5"
features = ["cargo"]

[dev-dependencies.rustyline]
version = "14.0"

[workspace]
resolver = "2"
